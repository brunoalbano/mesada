name: CI

# Verificação de toda mudança. O que aplica migration e publica está em
# deploy.yml, disparado por push em main e por tag.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-secrets.sh tudo

  aplicacao:
    name: Aplicação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # O build não recebe segredo: as chaves públicas bastam para compilar, e
      # valores falsos provam que nada de servidor vazou para o bundle.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-build

  banco:
    name: Banco
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: scripts/db-test.sh mesada_ci
